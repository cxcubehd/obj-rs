name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Note the absence of `--all-features`: the `nightly` feature turns on `feature(ptr_metadata)`
      # and therefore only builds on the nightly channel, where the `nightly` job covers it.
      - run: cargo test --workspace
      - run: cargo test -p obj --no-default-features

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      # The MSRV applies to the library, not to dev-dependencies: `trybuild` itself requires a
      # newer compiler, so `cargo test` cannot run here. Building proves the crate and everything
      # its macros generate compile on the oldest supported toolchain.
      - run: cargo build --workspace
      - run: cargo build -p obj --no-default-features

  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build -p obj --no-default-features --target thumbv7em-none-eabi

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p obj --all-targets --no-default-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  nightly:
    name: nightly feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      # The `ui` tests are skipped: `trybuild` compares against rustc's stable diagnostics.
      - run: cargo test -p obj --features nightly -- --skip ui
      - run: cargo clippy -p obj --all-targets --features nightly

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri is what actually validates the fat-pointer reconstruction, subobject addressing and
      # virtual-base offset arithmetic.
      - run: cargo miri test --workspace -- --skip ui
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      # The `nightly` feature swaps the transmute in `rebuild_fat` for `ptr::from_raw_parts`, so it
      # needs its own run to be validated.
      - run: cargo miri test -p obj --features nightly -- --skip ui
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
