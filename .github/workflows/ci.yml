name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # Not `--all-features`: the `nightly` feature turns on `feature(ptr_metadata)`, which a
      # stable compiler rejects outright. It is exercised by the `nightly` job below.
      - run: cargo test --workspace
      - run: cargo test -p obj --no-default-features --features std

  nightly:
    name: nightly feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # Covers the `core::ptr::from_raw_parts` path that replaces the stable transmute.
      - run: cargo test --workspace --features nightly

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      # The MSRV applies to the library, not to dev-dependencies: `trybuild` itself requires a
      # newer compiler, so `cargo test` cannot run here. Building proves the crate and everything
      # its macros generate compile on the oldest supported toolchain.
      - run: cargo build --workspace
      - run: cargo build -p obj --no-default-features

  no_std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build -p obj --no-default-features --target thumbv7em-none-eabi

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri is what actually validates the fat-pointer reconstruction, subobject addressing and
      # virtual-base offset arithmetic.
      #
      # Two runs, because virtual bases are the one feature that cannot be checked under strict
      # provenance. Reaching a shared base means addressing a *sibling* of the subobject you hold,
      # and a reference grants permission for its own subobject only; `obj` therefore exposes the
      # complete object's provenance for those hierarchies, which strict provenance forbids by
      # construction. Everything else stays under the stricter model.
      - name: stacked borrows, strict provenance
        run: >
          cargo miri test -p obj
          --test golden
          --test single_inheritance
          --test multiple_inheritance
          --test shared_handles
          --test std_traits
          --test dsl
          --test non_send_class
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      - name: tree borrows, whole workspace
        run: cargo miri test --workspace -- --skip ui
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
