[package]
name = "obj"
description = "C++-style inheritance for Rust: virtual functions, multiple inheritance, virtual bases and dynamic casts"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
obj-macros = { workspace = true }

[features]
default = ["std"]
# Enables `std`-only conveniences. The crate is `no_std + alloc` without it.
std = []
# Uses `core::ptr::from_raw_parts` instead of a transmute to rebuild fat pointers.
nightly = []

[dev-dependencies]
trybuild = "1.0"

# Timed directly rather than through a benchmark framework, so `cargo bench` needs no extra
# dependencies and CI does not pay to compile one.
[[bench]]
name = "dispatch"
harness = false

[lints]
workspace = true
